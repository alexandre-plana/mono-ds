<!doctype html>
<html lang="fr" data-theme="encre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application à onglets — gabarit MONO</title>
  <link rel="stylesheet" href="../../src/mono.css">
</head>
<!-- GABARIT D'APPLICATION À ONGLETS — à copier comme point de départ.

     Pour une application dont les parties sont séparées et entre lesquelles on saute
     sans cesse. Chaque partie est un ONGLET, et un onglet est une page qui reste
     ouverte : en y revenant, on la retrouve telle qu'on l'a laissée (filtre saisi,
     ligne ouverte, position de défilement, note en cours).

       sur le plan   les onglets (.c-doctabs), au-dessus de la page. Les modules sont
                     permanents ; ce que l'on ouvre en plus (une agence, les réglages)
                     s'ajoute à droite et se ferme. Quand ils ne tiennent plus, ceux qui
                     dépassent se rangent dans le menu « … ».
       en haut       le fil d'Ariane, toujours présent : famille / page / détail.
                     À droite, « Aller à » et le menu de l'utilisateur.
       en bas        la barre d'état.

     « Plan » (touche G, ou un clic sur les hachures) montre toutes les pages de
     l'application ; une page s'y ouvre en onglet ou se pose À CÔTÉ de la page courante.

     Si l'application est un arbre dans lequel on descend, partir plutôt de application.html.
     Les panneaux des onglets sont créés par ../assets/tabs-demo.js : c'est là que se
     trouve ce qui est À REMPLACER par les écrans réels. -->
<body class="l-desk l-desk--app l-desk--tabs">

  <nav class="c-doctabs" id="tabs" aria-label="Pages ouvertes">
    <button class="c-doctabs__tab c-doctabs__tab--tool" type="button" id="plan-open" aria-pressed="false"><i class="c-icon i-grid" aria-hidden="true"></i>Plan</button>
    <div role="tablist" aria-label="Onglets" id="tablist" style="display: contents"></div>
    <details class="c-menu c-menu--end c-doctabs__more" id="more" hidden>
      <summary class="c-doctabs__tab" id="more-label"></summary>
      <div class="c-menu__list" role="menu" id="more-list"></div>
    </details>
  </nav>

  <div class="l-shell" id="page">
    <div class="l-pane">
      <div class="l-pane__head">
        <header class="c-masthead">
          <nav class="c-breadcrumb c-breadcrumb--head" aria-label="Fil d'Ariane" id="crumbs"></nav>
          <div class="l-cluster" style="--gap: var(--space-2); flex-wrap: nowrap">
            <button class="c-button c-button--quiet" type="button" id="goto">Aller à <span class="c-kbd" aria-hidden="true">/</span></button>
            <details class="c-menu c-menu--end" id="user">
              <summary class="c-button c-button--quiet">M. Delorme<i class="c-icon i-chevron-down" aria-hidden="true"></i></summary>
              <div class="c-menu__list" role="menu">
                <button class="c-menu__item" type="button" role="menuitem" data-open="Réglages">Réglages</button>
                <button class="c-menu__item" type="button" role="menuitem" data-console>Console <span class="c-menu__hint">C</span></button>
                <hr class="c-menu__sep">
                <a class="c-menu__item" role="menuitem" href="connexion.html">Quitter</a>
              </div>
            </details>
          </div>
        </header>
      </div>

      <!-- Les panneaux des onglets sont ajoutés ici ; ils restent dans le document tant que l'onglet est ouvert. -->
      <div id="panels" style="display: contents"></div>

      <div class="l-pane__foot">
        <div class="c-statusbar">
          <span class="c-statusbar__group"><span class="c-status c-status--on">Connecté</span> <span class="c-statusbar__group">Exercice 2026 · T3</span> <span class="c-statusbar__group g-bracket" id="tab-count"></span></span>
          <span class="c-statusbar__group"><span class="c-kbd">G</span> plan <span class="c-statusbar__group"><span class="c-kbd">/</span> aller à</span><span class="c-statusbar__group"><a href="../index.html">Catalogue</a></span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Page posée à côté : une seconde page, lue pendant qu'on travaille sur la première. -->
  <aside class="l-shell" id="beside" aria-label="Page posée à côté" hidden>
    <div class="l-pane">
      <div class="l-pane__head">
        <header class="c-masthead">
          <nav class="c-breadcrumb c-breadcrumb--head" aria-label="Page d'à côté" style="flex-wrap: nowrap"><span aria-current="page" id="beside-title"></span></nav>
          <div class="l-cluster" style="--gap: var(--space-1); flex-wrap: nowrap">
            <button class="c-button c-button--quiet" type="button" id="beside-swap">Ouvrir en grand</button>
            <button class="c-button c-button--quiet" type="button" id="beside-close" aria-label="Retirer la page d'à côté"><i class="c-icon i-close" aria-hidden="true"></i></button>
          </div>
        </header>
      </div>
      <div class="l-pane__body">
        <h2 class="t-title"><span id="beside-hero"></span> <span class="t-soft t-body" id="beside-label"></span></h2>
        <p class="t-soft" id="beside-desc" style="max-width: 46ch"></p>
      </div>
      <div class="l-pane__foot"><div class="c-statusbar"><span class="c-statusbar__group" id="beside-family"></span><span class="c-statusbar__group">À côté · lecture</span></div></div>
    </div>
  </aside>

  <nav class="c-plan" id="plan" aria-label="Plan de l'application" hidden></nav>

  <!-- Console : une fenêtre flottante, ouverte à la demande. -->
  <section class="c-window c-window--resizable" id="console" role="dialog" aria-label="Console" hidden style="right: calc(3 * var(--shell-inset)); bottom: calc(4 * var(--shell-inset)); --window: 34rem; --window-height: 18rem">
    <div class="c-window__frame">
      <header class="c-window__bar">
        <i class="c-icon i-grip" aria-hidden="true"></i>
        <span class="c-window__title">Console</span>
        <button class="c-button c-button--quiet" type="button" id="console-close" aria-label="Fermer"><i class="c-icon i-close" aria-hidden="true"></i></button>
      </header>
      <div class="c-window__body c-window__body--flush">
        <section class="c-console c-console--fill" style="--console-pad: var(--space-4); border-top: 0; flex: 1" aria-label="Journal">
          <ol class="c-console__log" id="log" role="log" aria-live="polite"></ol>
          <label class="c-console__prompt"><span aria-hidden="true">&gt;</span><input type="text" id="cmd" placeholder="aide" aria-label="Commande" autocomplete="off" spellcheck="false"></label>
        </section>
      </div>
    </div>
  </section>

  <script src="../assets/console.js"></script>
  <script src="../assets/palette.js"></script>
  <script src="../assets/tabs-demo.js"></script>
</body>
</html>
