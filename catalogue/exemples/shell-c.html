<!doctype html>
<html lang="fr" data-theme="encre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C · Feuillets — proposition de shell MONO</title>
  <link rel="stylesheet" href="../../src/mono.css">
  <link rel="stylesheet" href="../assets/propositions.css">
</head>
<!-- PROPOSITION DE SHELL — C : chaque niveau est une page. En descendant, la page précédente se range sur la tranche ; la pile des tranches est le fil d'Ariane. Cliquer une ligne du tableau ouvre un feuillet de plus. -->
<body class="l-desk l-desk--app l-desk--app p-sheets">
  <template id="t-screen">
        <div class="l-split" style="align-items: flex-end">
          <p class="t-title"><span data-count>412</span> <span class="t-soft t-body">agences</span></p>
          <button class="c-button c-button--primary" type="button"><i class="c-icon i-plus" aria-hidden="true"></i>Nouvelle agence</button>
        </div>
        <div class="l-grid" style="align-items: start">
          <div class="c-stat c-stat--compact c-stat--ruled l-span-3"><span class="c-stat__label">Primes</span><span class="c-stat__value">1 780<small>M</small></span><span class="c-stat__note">+4,2 % sur un an</span></div>
          <div class="c-stat c-stat--compact c-stat--ruled l-span-3"><span class="c-stat__label">Effectif</span><span class="c-stat__value">2 961</span><span class="c-stat__note">7,2 par agence</span></div>
          <div class="c-stat c-stat--compact c-stat--ruled l-span-3"><span class="c-stat__label">Service</span><span class="c-stat__value">98,4<small>%</small></span><span class="c-stat__note">Objectif 98 %</span></div>
          <div class="c-stat c-stat--compact c-stat--ruled l-span-3"><span class="c-stat__label">Ouvertures</span><span class="c-stat__value">3</span><span class="c-stat__note">Depuis janvier</span></div>
        </div>
        <table class="c-table" data-table>
          <thead><tr><th>Réf.</th><th>Agence</th><th>Responsable</th><th>État</th><th class="is-num">Primes (M)</th></tr></thead>
          <tbody>
            <tr tabindex="0" data-ref="N-011" data-nom="Chambéry"><td class="t-muted u-nowrap">N-011</td><th>Chambéry</th><td>A. Perrin</td><td><span class="c-status c-status--on">Actif</span></td><td class="is-num">7,9</td></tr>
            <tr tabindex="0" data-ref="N-014" data-nom="Grenoble Centre"><td class="t-muted u-nowrap">N-014</td><th>Grenoble Centre</th><td>M. Delorme</td><td><span class="c-status c-status--on">Actif</span></td><td class="is-num">12,4</td></tr>
            <tr tabindex="0" data-ref="N-015" data-nom="Voiron"><td class="t-muted u-nowrap">N-015</td><th>Voiron</th><td>S. Garcin</td><td><span class="c-status c-status--progress">En cours</span></td><td class="is-num">4,1</td></tr>
            <tr tabindex="0" data-ref="N-016" data-nom="Vizille"><td class="t-muted u-nowrap">N-016</td><th>Vizille</th><td>L. Brun</td><td><span class="c-status c-status--critical">Fermeture</span></td><td class="is-num">0,9</td></tr>
          </tbody>
        </table>
  </template>
  <script>
    (() => {
      const desk = document.body, tpl = document.getElementById('t-screen');
      const TOC = [["Réseau", [["01", "Synthèse", "Chiffres clés du trimestre"], ["02", "Agences", "412 points de vente"], ["03", "Branches", "4 branches régionales"]]], ["Pilotage", [["04", "Rapports", "Annuel, trimestriels"], ["05", "Journal", "Opérations et diagnostics"]]], ["Système", [["06", "Réglages", "Comptes, droits, sources"]]]];
      // La pile : chaque entrée sait dessiner sa page.
      const stack = [{ title: 'Mono', kind: 'toc' }, { title: 'Réseau', kind: 'group' }, { title: 'Agences', kind: 'screen' }];
      const status = (hint) => `<div class="l-pane__foot"><div class="c-statusbar"><span class="c-statusbar__group"><span class="c-status c-status--on">M. Delorme</span></span><span class="c-statusbar__group">${hint}<span class="c-statusbar__group"><a href="../index.html">Catalogue</a></span></span></div></div>`;
      const page = (s, i) => {
        let body = '';
        if (s.kind === 'screen') body = tpl.innerHTML;
        else if (s.kind === 'toc') body = '<p class="t-title">Sommaire</p><div class="p-toc">' + TOC.map(([g, items]) => `<section class="l-stack" style="--gap: var(--space-4)"><h2 class="c-section-head"><span>${g}</span></h2><div class="c-index" style="counter-reset: idx ${+items[0][0] - 1}">${items.map(([n, t, d]) => `<a class="c-index__row" href="#" data-push="${g}|${t}"><span class="c-index__title">${t}</span><span class="c-index__value">${d}</span></a>`).join('')}</div></section>`).join('') + '</div>';
        else if (s.kind === 'group') body = `<p class="t-title">${s.title}</p><div class="c-index" style="max-width: 40rem; counter-reset: idx ${+(TOC.find(([g]) => g === s.title) || TOC[0])[1][0][0] - 1}">${(TOC.find(([g]) => g === s.title) || TOC[0])[1].map(([n, t, d]) => `<a class="c-index__row" href="#" data-push="|${t}"><span class="c-index__title">${t}</span><span class="c-index__value">${d}</span></a>`).join('')}</div>`;
        else body = `<div class="c-stat"><span class="c-stat__label">${s.ref}</span><span class="c-stat__value">${s.title}</span></div><dl class="c-kv c-kv--plain" style="max-width: 28rem"><div><dt>Branche</dt><dd>Nord</dd></div><div><dt>Responsable</dt><dd>${s.resp}</dd></div><div><dt>Primes</dt><dd>${s.primes} M</dd></div></dl>`;
        return `<div class="l-shell"><div class="l-pane"><div class="l-pane__head"><header class="c-masthead"><h1 class="c-masthead__title">${s.title}</h1><div class="c-masthead__meta"><span class="g-bracket">${i + 1} / ${stack.length}</span><span>T3</span></div></header></div><main class="l-pane__body">${body}</main>${status('<span class="c-kbd">←</span> remonter ')}</div></div>`;
      };
      const render = () => {
        desk.querySelectorAll(':scope > .l-shell').forEach((n) => n.remove());
        const last = stack.length - 1;
        desk.style.setProperty('--p-cols', '2.75rem '.repeat(last) + 'minmax(0, 1fr)');
        const html = stack.map((s, i) => (i < last ? `<a class="l-shell p-spine" href="#" data-pop="${i}" aria-label="Revenir à ${s.title}"><span class="p-spine__num">${String(i + 1).padStart(2, '0')}</span><span class="p-spine__title">${s.title}</span><i class="c-icon i-chevron-left p-spine__foot" aria-hidden="true"></i></a>` : page(s, i))).join('');
        tpl.insertAdjacentHTML('beforebegin', html);
      };
      desk.addEventListener('click', (e) => {
        const pop = e.target.closest('[data-pop]'), push = e.target.closest('[data-push]'), row = e.target.closest('tr[data-ref]');
        if (pop) { e.preventDefault(); stack.length = +pop.dataset.pop + 1; render(); }
        else if (push) { e.preventDefault(); const [g, t] = push.dataset.push.split('|'); if (g) stack.push({ title: g, kind: 'group' }); stack.push({ title: t, kind: 'screen' }); render(); }
        else if (row) { stack.push({ title: row.dataset.nom, ref: row.dataset.ref, kind: 'detail', resp: row.cells[2].textContent, primes: row.cells[4].textContent }); render(); }
      });
      document.addEventListener('keydown', (e) => { if ((e.key === 'ArrowLeft' || e.key === 'Escape') && stack.length > 1) { stack.pop(); render(); } });
      render();
    })();
  </script>
</body>
</html>
